{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="?{% if techno_active %}techno={{ techno_active|urlencode }}&{% endif %}page={{ page.previous_page_number }}">← Précédent</a>{% endif %}
  <span>Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% if techno_active %}techno={{ techno_active|urlencode }}&{% endif %}page={{ page.next_page_number }}">Suivant →</a>{% endif %}
</nav>
{% endif %}
